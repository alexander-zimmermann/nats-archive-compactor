[project]
name = "nats-archive-compactor"
version = "0.15.0"
description = "Compactor for the nats-archive bucket on RustFS: merges hourly Parquet files into daily files and finished months into monthly files"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.15.2"
authors = [
    { name = "Alexander Zimmermann" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving",
]
dependencies = [
    "boto3>=1.43.122",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "testcontainers>=4.15.0",
    "boto3-stubs[s3]>=1.43.122",
]

[project.scripts]
nats-archive-compactor = "nats_archive_compactor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nats_archive_compactor"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
# pyarrow ships no type information (no stubs, no py.typed marker).
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Pylance/Pyright counterparts — quiet the same pyarrow stub gaps.
[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportAttributeAccessIssue = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryComparison = "none"
reportPrivateImportUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
